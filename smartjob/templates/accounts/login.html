{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card">
  <h1 class="h3 mb-1">Welcome back</h1>
  <p class="text-muted">Log in to apply for jobs or manage your postings.</p>
  <form method="post">{% csrf_token %}
    {% include '_form.html' %}
    <button class="btn btn-accent w-100">Login</button>
  </form>
  <p class="mt-3 mb-0 small">New here? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
