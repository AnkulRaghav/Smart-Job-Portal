{% extends 'base.html' %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="auth-card">
  <h1 class="h3 mb-1">Create your account</h1>
  <p class="text-muted">Candidates get an instant resume match score on every application.</p>
  <form method="post">{% csrf_token %}
    {% include '_form.html' %}
    <button class="btn btn-accent w-100">Sign up</button>
  </form>
  <p class="mt-3 mb-0 small">Already registered? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
